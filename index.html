<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Gift For You ♡</title>
<style>
  :root {
    --pink: #f6cddd;
    --pink-deep: #dfa5bf;
    --pink-light: #fff4f8;
    --lavender: #e8dcf7;
    --blue: #dceefa;
    --butter: #fff0c9;
    --ink: #a87591;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px 14px; background: #fff8fb; color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
  }
  .gift-machine {
    width: min(100%, 430px); text-align: center;
    background: var(--pink-light); padding: 25px 16px 20px;
    border: 1px solid #f2d7e3; border-radius: 25px;
    box-shadow: 0 12px 35px #d9a9bf30;
  }
  .title { font-size: 19px; letter-spacing: 2px; margin-bottom: 17px; }
  .subtitle { font-size: 12px; letter-spacing: 1px; margin: -7px 0 18px; opacity: .8; }
  .machine {
    background: var(--pink); border: 4px solid var(--pink-deep);
    border-radius: 34px 34px 21px 21px; padding: 13px;
    box-shadow: 0 7px 0 #d99ab5;
  }
  .machine-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 12px; border-radius: 18px; background: #fff0f6;
    font-size: 11px; letter-spacing: 1.2px;
  }
  .window {
    height: 205px; position: relative; overflow: hidden; margin: 14px 0;
    border: 5px solid #e8b4ca; border-radius: 20px; background: #fffafd;
  }
  .hearts {
    position: absolute; inset: 12px 10px; display: flex; flex-wrap: wrap;
    justify-content: center; align-content: flex-start; gap: 9px 13px;
    font-family: Arial, sans-serif; font-size: 25px; opacity: .9;
  }
  .heart { text-shadow: 0 2px 2px #d9b5c733; }
  .heart:nth-child(5n+1) { color: #f4aeca; }
  .heart:nth-child(5n+2) { color: #cbb5ec; }
  .heart:nth-child(5n+3) { color: #f3d68f; }
  .heart:nth-child(5n+4) { color: #a9d5e9; }
  .heart:nth-child(5n) { color: #e7c6d7; }
  .capsule {
    display: none; position: absolute; left: 50%; top: 50%;
    width: 76px; height: 92px; transform: translate(-50%, -50%);
    border-radius: 42px; overflow: hidden; border: 3px solid #e3a9c2;
    background: linear-gradient(to bottom, #f7c9dc 0 49%, #fff0f6 50% 100%);
    box-shadow: 0 5px 12px #c98da855;
  }
  .capsule::before {
    content: "♥"; position: absolute; inset: 0; display: grid; place-items: center;
    color: #e99cba; font: 30px Arial, sans-serif; text-shadow: 0 1px #fff;
  }
  .capsule.show { display: block; animation: drop .85s cubic-bezier(.2,.8,.3,1); }
  @keyframes drop {
    0% { transform: translate(-50%, -180px) rotate(-25deg); }
    65% { transform: translate(-50%, -35%) rotate(14deg); }
    82% { transform: translate(-50%, -55%) rotate(-8deg); }
    100% { transform: translate(-50%, -50%) rotate(0); }
  }
  .machine-bottom { background: #fff0f6; border-radius: 15px; padding: 12px; }
  .slot { width: 65px; height: 31px; margin: 0 auto 12px; border-radius: 8px;
    background: #dfabc2; color: white; line-height: 31px; font-size: 18px; }
  button {
    border: 0; border-radius: 30px; padding: 13px 24px;
    background: #d99ab6; color: white; font: 13px Georgia, serif;
    letter-spacing: 1.2px; cursor: pointer; transition: transform .2s, background .2s;
  }
  button:hover { background: #c783a3; transform: translateY(-2px); }
  button:disabled { opacity: .65; cursor: default; transform: none; }
  .message {
    min-height: 88px; display: grid; place-items: center;
    margin-top: 22px; padding: 17px 14px; border-radius: 16px;
    background: white; border: 1px dashed #e4b4ca; line-height: 1.6;
    font-size: 16px;
  }
  .counter { margin-top: 12px; font: 10px Arial, sans-serif; letter-spacing: 1.2px; opacity: .75; }
  .tiny { margin-top: 15px; font-size: 11px; opacity: .75; }
</style>
</head>
<body>
  <main class="gift-machine">
    <div class="title">A LITTLE GIFT FOR YOU ♡</div>
    <div class="subtitle">a tiny capsule full of love</div>

    <section class="machine">
      <div class="machine-top"><span>♡</span><span>LUCKY CAPSULES</span><span>♡</span></div>
      <div class="window">
        <div class="hearts" aria-hidden="true">
          <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
          <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
          <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
          <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
          <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
        </div>
        <div class="capsule" id="capsule"></div>
      </div>
      <div class="machine-bottom">
        <div class="slot">♡</div>
        <button id="getPrize">GET YOUR PRIZE!</button>
      </div>
    </section>

    <div class="message" id="message">a little surprise is waiting for you ♡</div>
    <div class="counter" id="counter">0 / 15 little gifts opened</div>
    <div class="tiny">made with so much love ♡</div>
  </main>

<script>
const prizes = [
  "You're one of my favorite people in the whole world. ♡",
  "I hope you know how special you are to me.",
  "A little reminder that you are so loved. ♡",
  "If I could choose my friends all over again, I'd choose you.",
  "You make ordinary days so much better.",
  "Never forget how amazing you are!",
  "Sending you the biggest virtual hug ever. ♡",
  "I'm so lucky to have you in my life.",
  "You deserve all the happiness in the world.",
  "Thank you for being YOU. ♡",
  "I hope we find each other in every universe.",
  "It's always better when we're together.",
  "I have so so so much love for you in my heart it doesn't fit.",
  "No matter how much I say I love you, I always love you more than that.",
  "You are my home. ♡"
];

const button = document.getElementById("getPrize");
const capsule = document.getElementById("capsule");
const message = document.getElementById("message");
const counter = document.getElementById("counter");
let remaining = [...prizes];
let opened = 0;

button.addEventListener("click", () => {
  if (remaining.length === 0) {
    message.textContent = "You opened every little gift! I hope you know how loved you are. ♡";
    button.textContent = "ALL GIFTS OPENED ♡";
    button.disabled = true;
    return;
  }

  button.disabled = true;
  message.textContent = "your little surprise is opening... ♡";
  capsule.classList.remove("show");
  void capsule.offsetWidth;
  capsule.classList.add("show");

  const index = Math.floor(Math.random() * remaining.length);
  const prize = remaining.splice(index, 1)[0];
  opened++;
  counter.textContent = `${opened} / ${prizes.length} little gifts opened`;

  window.setTimeout(() => {
    message.textContent = prize;
    button.disabled = false;
    button.textContent = remaining.length ? "GET ANOTHER PRIZE!" : "LAST LITTLE GIFT ♡";
  }, 900);
});
</script>
</body>
</html>
